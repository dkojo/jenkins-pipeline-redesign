# NGINX in front of all three services: one address, one path per service.
server {
    listen 80;
    location /catalog/ { proxy_pass http://catalog:8080; }   # .NET (Kestrel)
    location /orders/  { proxy_pass http://orders:8080; }    # Java (Tomcat)
    location /cart/    { proxy_pass http://cart:8080; }      # Node.js
}
